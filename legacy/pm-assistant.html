<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM Assistant</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --panel2:#f8f9fb; --text:#1d2330; --muted:#6b7280; --line:#e4e7ec;
  --accent:#2563eb; --accent-weak:#e8efff; --danger:#c62828; --danger-weak:#fdecec;
  --warn:#a15c00; --warn-weak:#fff3df; --ok:#15803d; --ok-weak:#e6f5eb;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 6px rgba(16,24,40,.04);
  --drawer:540px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#131519; --panel:#1b1e24; --panel2:#20242b; --text:#e6e8ec; --muted:#9aa1ad; --line:#2d323b;
    --accent:#6b9bff; --accent-weak:#1e2a45; --danger:#f87171; --danger-weak:#3b1f22;
    --warn:#fbbf24; --warn-weak:#3a2f17; --ok:#4ade80; --ok-weak:#16301f; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI",system-ui,-apple-system,"Microsoft YaHei",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.side{width:200px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font-weight:700;font-size:16px;padding:4px 10px 14px}
.nav{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.nav:hover{background:var(--panel2)}
.nav.on{background:var(--accent-weak);color:var(--accent);font-weight:600}
.nav .n{margin-left:auto;font-size:12px;background:var(--danger);color:#fff;border-radius:10px;padding:0 7px}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:8px 10px;border-top:1px solid var(--line)}
.side .foot button{margin-top:6px}
.main{flex:1;min-width:0;padding:20px 28px 60px;transition:margin-right .18s}
@media (min-width:1100px){ body.drawer-open .main{margin-right:var(--drawer)} }
.head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.head h1{font-size:20px;margin:0;margin-right:auto}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.btn.sm{padding:2px 8px;font-size:12px}
.btn.link{border:0;background:none;color:var(--accent);padding:0 4px}
.btn.icon{border:0;background:none;padding:2px 8px;font-size:16px;color:var(--muted)}
.btn.icon:hover{color:var(--text)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .r{margin-left:auto;font-weight:400;display:flex;gap:6px;align-items:center}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.stat b{display:block;font-size:24px;line-height:1.2}
.stat span{color:var(--muted);font-size:12px}
.stat.danger b{color:var(--danger)} .stat.warn b{color:var(--warn)}
.muted{color:var(--muted)} .small{font-size:12px}
.empty{color:var(--muted);padding:10px 0;font-size:13px}
/* colors for statuses and record types */
.c-gray{--c:#6b7280} .c-blue{--c:#2563eb} .c-purple{--c:#7c3aed} .c-amber{--c:#c27803} .c-red{--c:#dc2626}
.c-green{--c:#16a34a} .c-teal{--c:#0d9488} .c-pink{--c:#db2777}
@media (prefers-color-scheme: dark){
  .c-gray{--c:#9ca3af} .c-blue{--c:#6b9bff} .c-purple{--c:#b794f6} .c-amber{--c:#fbbf24} .c-red{--c:#f87171}
  .c-green{--c:#4ade80} .c-teal{--c:#2dd4bf} .c-pink{--c:#f472b6}
}
.chip{display:inline-block;font-size:12px;padding:0 7px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.chip.cc{background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);border-color:transparent}
.chip.warn{background:var(--warn-weak);color:var(--warn);border-color:transparent}
.chip.danger{background:var(--danger-weak);color:var(--danger);border-color:transparent}
.chip.ok{background:var(--ok-weak);color:var(--ok);border-color:transparent}
.sdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.trow{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.trow:last-child{border-bottom:0}
.trow:hover{background:var(--panel2)}
.trow.sel,.kcard.sel,tr.sel{background:var(--accent-weak)}
.trow.done .ttitle{text-decoration:line-through;color:var(--muted)}
.trow input[type=checkbox]{width:16px;height:16px;flex:none;cursor:pointer}
.prio{width:4px;height:28px;border-radius:2px;flex:none}
.p-high{background:var(--danger)} .p-medium{background:var(--warn)} .p-low{background:var(--line)}
.tmain{flex:1;min-width:0}
.ttitle{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.due{font-size:12px;white-space:nowrap;color:var(--muted)}
.due.danger{color:var(--danger);font-weight:600} .due.warn{color:var(--warn);font-weight:600}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input[type=text],input[type=date],input[type=number],input:not([type]),select,textarea{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 9px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{width:100%;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 12px;cursor:pointer}
.seg button.on{background:var(--accent-weak);color:var(--accent);font-weight:600}
.kanban{display:grid;gap:12px;align-items:start;overflow-x:auto;padding-bottom:6px}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:200px}
.col.over{border-color:var(--accent);background:var(--accent-weak)}
.col h3{font-size:13px;margin:2px 4px 8px;display:flex;gap:6px;align-items:center}
.col h3 .muted{font-weight:400}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;cursor:grab;box-shadow:var(--shadow);border-left:3px solid var(--line)}
.kcard.p-high{border-left-color:var(--danger)} .kcard.p-medium{border-left-color:var(--warn)}
.kcard .ttitle{white-space:normal}
.kcard .tmeta{margin-top:4px}
.pcard{cursor:pointer}
.pcard:hover{border-color:var(--accent)}
.pcard h3{margin:0 0 2px;font-size:15px}
.prog{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin:8px 0 4px;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--ok)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover{background:var(--panel2)}
.ts th.day{cursor:pointer}
.ts th.day.on{color:var(--accent);background:var(--accent-weak)}
.ts td.low{color:var(--warn)}
.ts tfoot td{font-weight:600}
/* centered modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:60}
.modal[hidden]{display:none}
.mbox{background:var(--panel);border-radius:12px;width:min(640px,100%);padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.mbox h2{margin:0 0 14px;font-size:17px;display:flex;align-items:center;gap:8px}
.mbox h2 .x{margin-left:auto}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.form label>*{font-size:14px;color:var(--text)}
.form .full{grid-column:1/-1}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;align-items:center}
.actions .l{margin-right:auto}
/* right-side task drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:var(--drawer);max-width:100%;background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.08);z-index:40;display:flex;flex-direction:column;animation:slidein .18s ease-out}
.drawer[hidden]{display:none}
@keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.dhead{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 18px;border-bottom:1px solid var(--line)}
.dhead .sp{flex:1}
.dscroll{flex:1;overflow:auto;padding:14px 18px 40px}
.dtitle{font-size:18px;font-weight:600;border:1px solid transparent;width:100%;padding:4px 6px;margin-left:-7px;border-radius:6px;background:transparent}
.dtitle:hover{border-color:var(--line)}
.props{display:grid;grid-template-columns:90px 1fr 90px 1fr;gap:8px 10px;align-items:center;margin:10px 0}
.props>span{font-size:12px;color:var(--muted)}
.props select,.props input{width:100%}
.sect{font-size:13px;font-weight:600;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.sect .r{margin-left:auto;font-weight:400}
.composer{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel2)}
.pills{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.pills label{cursor:pointer}
.pills input{display:none}
.pills span{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 9px;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.pills input:checked+span{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);font-weight:600}
.crow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.crow[hidden]{display:none}
.crow .sp{flex:1}
.tlstats{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:6px}
.tlstats b{color:var(--text)}
.tlf{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.tlf button{font-size:12px;padding:1px 9px;border-radius:14px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.tlf button.on{background:var(--accent-weak);color:var(--accent);border-color:transparent;font-weight:600}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-day{position:relative;font-size:12px;font-weight:600;margin:14px 0 6px;display:flex;gap:8px}
.tl-day:first-child{margin-top:0}
.tl-day::before{content:"";position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:3px;background:var(--panel);border:2px solid var(--muted)}
.tl-day .muted{font-weight:400}
.tl-item{position:relative;margin-bottom:8px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:8px;padding:6px 10px}
.tl-item::before{content:"";position:absolute;left:-23px;top:10px;width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--panel)}
.tl-item .th{display:flex;gap:8px;align-items:center;font-size:12px}
.tl-item .th b{color:var(--c)}
.tl-item .th .sp{flex:1}
.tl-item .tx{white-space:pre-wrap;word-break:break-word;margin-top:2px}
.tl-item .cm{font-size:12px;margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tl-item .del{visibility:hidden}
.tl-item:hover .del{visibility:visible}
.tl-sys{position:relative;font-size:12px;color:var(--muted);margin:0 0 8px;padding:2px 0 2px 2px}
.tl-sys::before{content:"";position:absolute;left:-20px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.tl-sys .del{visibility:hidden}
.tl-sys:hover .del{visibility:visible}
/* timesheet + misc */
.log{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.log .d{width:100px;flex:none;font-size:12px;color:var(--muted)}
.log .c{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}
.log .h{font-size:12px;white-space:nowrap}
.summary{font-family:Consolas,"Segoe UI",monospace;font-size:13px;min-height:220px}
.srow{display:grid;grid-template-columns:110px 1fr auto auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.srow .ctl{display:flex;gap:2px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d2330;color:#fff;padding:8px 16px;border-radius:8px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.banner{background:var(--warn-weak);color:var(--warn);border-radius:8px;padding:8px 12px;margin-bottom:14px;display:flex;gap:10px;align-items:center}
.welcome{max-width:640px}
.welcome ol{padding-left:20px}
.kbd{font-family:Consolas,monospace;font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--panel2)}
@media (max-width:900px){
  .app{flex-direction:column}
  .side{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;padding:8px}
  .side .foot,.brand{display:none}
  .nav{width:auto}
  .main{padding:16px}
  .form{grid-template-columns:1fr}
  .props{grid-template-columns:80px 1fr}
  .g2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">PM Assistant</div>
    <button class="nav" data-act="nav" data-view="today">Today<span class="n" id="n-today" hidden></span></button>
    <button class="nav" data-act="nav" data-view="board">Task Board</button>
    <button class="nav" data-act="nav" data-view="projects">Projects</button>
    <button class="nav" data-act="nav" data-view="timesheet">Timesheet</button>
    <button class="nav" data-act="nav" data-view="settings">Settings &amp; Data</button>
    <div class="foot" id="file-badge"></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<aside class="drawer" id="drawer" hidden aria-label="Task details"></aside>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast"></div>
<input type="file" id="import-input" accept=".json,application/json" hidden>

<script>
'use strict';
/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const weekStart = s => { const d = parse(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return ymd(d); };
const dayDiff = (a, b) => Math.round((parse(a) - parse(b)) / 864e5);
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtMD = s => s ? `${+s.slice(8, 10)} ${MON[+s.slice(5, 7) - 1]}` : '';
const fmtDate = s => s ? `${WD[parse(s).getDay()]} ${fmtMD(s)}` : '';
const fmtFull = s => s ? `${fmtDate(s)} ${s.slice(0, 4)}` : '';
const relDay = s => { const d = dayDiff(today(), s); return d === 0 ? 'Today' : d === 1 ? 'Yesterday' : d === -1 ? 'Tomorrow' : fmtDate(s) + (s.slice(0, 4) !== today().slice(0, 4) ? ' ' + s.slice(0, 4) : ''); };
const round2 = n => Math.round(n * 100) / 100;
const fmtH = n => `${round2(n)}h`;
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const by = (f, dir = 1) => (a, b) => { const x = f(a), y = f(b); return x < y ? -dir : x > y ? dir : 0; };

const COLORS = ['gray', 'blue', 'purple', 'amber', 'red', 'green', 'teal', 'pink'];
const PRIO = {high: 'High', medium: 'Medium', low: 'Low'};
const LOGTYPE = {work: 'Work log', note: 'Note', commit: 'Commitment', decision: 'Decision', risk: 'Risk / Issue'};
const LOGCOLOR = {work: 'blue', note: 'gray', commit: 'amber', decision: 'green', risk: 'red', status: 'gray'};
const PSTATUS = {active: 'Active', hold: 'On hold', closed: 'Closed'};
const MSTATUS = {planned: 'Not started', doing: 'In progress', done: 'Done'};
const DEFAULT_STATUSES = [
  {id: 'todo', name: 'To Do', color: 'gray', done: false},
  {id: 'doing', name: 'In Progress', color: 'blue', done: false},
  {id: 'waiting', name: 'Waiting', color: 'purple', done: false},
  {id: 'done', name: 'Done', color: 'green', done: true},
];

/* ---------- data ---------- */
const KEY = 'pm-assistant-db-v1';
function emptyDb() {
  return {version: 2, updatedAt: 0,
    settings: {me: '', hoursPerDay: 8, lastExport: 0, statuses: structuredClone(DEFAULT_STATUSES)},
    projects: [], milestones: [], tasks: [], logs: []};
}
function migrate(d) {
  d = Object.assign(emptyDb(), d || {});
  d.settings = Object.assign(emptyDb().settings, d.settings || {});
  if (!Array.isArray(d.settings.statuses) || !d.settings.statuses.length) d.settings.statuses = structuredClone(DEFAULT_STATUSES);
  for (const k of ['projects', 'milestones', 'tasks', 'logs']) if (!Array.isArray(d[k])) d[k] = [];
  d.version = 2;
  return d;
}
function loadDb() {
  try { const s = localStorage.getItem(KEY); if (s) return migrate(JSON.parse(s)); } catch (e) {}
  return emptyDb();
}
let db = loadDb();
function save() {
  db.updatedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {}
  scheduleFileSave();
}

const proj = id => db.projects.find(p => p.id === id);
const task = id => db.tasks.find(t => t.id === id);
const ms = id => db.milestones.find(m => m.id === id);
const statuses = () => db.settings.statuses;
const st = id => statuses().find(s => s.id === id) || statuses()[0];
const firstOpen = () => statuses().find(s => !s.done) || statuses()[0];
const firstDone = () => statuses().find(s => s.done) || statuses()[statuses().length - 1];
const isDone = t => !!st(t.status).done;
const isOpen = t => !isDone(t);
const isActivity = l => l.type !== 'status';
const projLabel = p => p ? (p.code ? `${p.code} ${p.name}` : p.name) : 'No project';
const owners = () => [...new Set([db.settings.me, ...db.tasks.map(t => t.owner), ...db.logs.map(l => l.who)].filter(Boolean))].sort();
const statusChip = id => { const s = st(id); return `<span class="chip cc c-${s.color}">${esc(s.name)}</span>`; };

function setStatus(t, to) {
  if (!t || t.status === to) return;
  const from = t.status, now = Date.now();
  t.status = to;
  t.doneAt = st(to).done ? (st(from).done ? t.doneAt : now) : 0;
  t.updatedAt = now;
  db.logs.push({id: uid(), taskId: t.id, projectId: t.projectId, date: today(), type: 'status', from, to,
    fromName: st(from).name, toName: st(to).name, text: '', hours: 0, createdAt: now});
  if (ui.taskId === t.id) {
    const sel = $('#drawer [name=status]'); if (sel) sel.value = to;
    refreshTimeline();
  }
}

/* ---------- data file (auto-save to a local JSON file) ---------- */
let fileHandle = null, fileState = 'none', lastFileSave = 0, saveTimer = null;
const fsSupported = 'showSaveFilePicker' in window;
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('pm-assistant', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function kv(k, v) {
  const d = await idb();
  return new Promise((res, rej) => {
    const s = d.transaction('kv', v === undefined ? 'readonly' : 'readwrite').objectStore('kv');
    const r = v === undefined ? s.get(k) : (v === null ? s.delete(k) : s.put(v, k));
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function initFile() {
  if (!fsSupported) return renderBadge();
  try {
    const h = await kv('fileHandle');
    if (h) {
      fileHandle = h;
      fileState = (await h.queryPermission({mode: 'readwrite'})) === 'granted' ? 'ok' : 'need';
      if (fileState === 'ok') await syncFromFile();
    }
  } catch (e) {}
  renderBadge();
}
async function syncFromFile() {
  const txt = await (await fileHandle.getFile()).text();
  if (txt.trim()) {
    const data = migrate(JSON.parse(txt));
    if ((data.updatedAt || 0) > (db.updatedAt || 0)) {
      db = data;
      try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {}
      render(); if (ui.taskId) renderDrawer();
      toast('Loaded newer data from the data file');
      return;
    }
  }
  await writeFile();
}
function scheduleFileSave() {
  if (fileState !== 'ok') return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(writeFile, 500);
}
async function writeFile() {
  try {
    const w = await fileHandle.createWritable();
    await w.write(JSON.stringify(db, null, 1));
    await w.close();
    lastFileSave = Date.now();
  } catch (e) { fileState = 'need'; }
  renderBadge();
}
const JSON_TYPES = [{description: 'JSON', accept: {'application/json': ['.json']}}];
async function linkNewFile() {
  try {
    const h = await showSaveFilePicker({suggestedName: 'pm-assistant-data.json', types: JSON_TYPES});
    fileHandle = h; fileState = 'ok';
    await kv('fileHandle', h);
    await writeFile();
    toast('Data file connected. Changes now save automatically.');
    render();
  } catch (e) { if (e.name !== 'AbortError') toast('Could not connect: ' + e.message); }
}
async function linkExistingFile() {
  try {
    const [h] = await showOpenFilePicker({types: JSON_TYPES});
    const data = migrate(JSON.parse(await (await h.getFile()).text()));
    if (!confirm(`Replace current data with this file?\nThe file has ${plural(data.projects.length, 'project')} and ${plural(data.tasks.length, 'task')}.`)) return;
    if ((await h.requestPermission({mode: 'readwrite'})) !== 'granted') return toast('Write permission was not granted');
    db = data; fileHandle = h; fileState = 'ok';
    await kv('fileHandle', h);
    save(); closeDrawer(); render();
    toast('Data file loaded and connected');
  } catch (e) { if (e.name !== 'AbortError') toast('Could not open: ' + e.message); }
}
async function reconnectFile() {
  try {
    if ((await fileHandle.requestPermission({mode: 'readwrite'})) === 'granted') {
      fileState = 'ok'; await syncFromFile(); toast('Data file reconnected');
    }
  } catch (e) { toast('Could not reconnect: ' + e.message); }
  renderBadge();
}
async function unlinkFile() {
  fileHandle = null; fileState = 'none';
  await kv('fileHandle', null);
  render();
}
function renderBadge() {
  const el = $('#file-badge');
  if (fileState === 'ok') el.innerHTML = `Auto-saving to<br><b>${esc(fileHandle.name)}</b>${lastFileSave ? `<br>${new Date(lastFileSave).toLocaleTimeString()}` : ''}`;
  else if (fileState === 'need') el.innerHTML = `Data file needs permission<br><button class="btn sm primary" data-act="reconnect-file">Reconnect</button>`;
  else el.innerHTML = `Data is saved in this browser only<br><button class="btn sm" data-act="nav" data-view="settings">Set up backup</button>`;
}

  if (diff === 0) return {cls: 'warn', txt: 'Due today'};
  if (diff === 1) return {cls: 'warn', txt: 'Due tomorrow'};
  if (diff <= 7) return {cls: '', txt: fmtDate(t.due)};
  return {cls: '', txt: fmtMD(t.due) + (t.due.slice(0, 4) !== today().slice(0, 4) ? ' ' + t.due.slice(0, 4) : '')};
}
const openCommitCount = id => db.logs.filter(l => l.taskId === id && l.type === 'commit' && !l.commitDone).length;

      <div class="small muted">You can edit the text before copying.</div></div>

function daySummary(date) {
  const logs = db.logs.filter(l => l.date === date && isActivity(l)).sort(by(l => l.createdAt || 0));
  if (!logs.length) return `${fmtFull(date)}\nNo records.`;
  const total = logs.reduce((s, l) => s + (+l.hours || 0), 0);
  const groups = {};
  for (const l of logs) (groups[l.projectId || ''] = groups[l.projectId || ''] || []).push(l);
  let out = `${fmtFull(date)} - Total ${fmtH(total)}\n`;
  for (const [pid, ls] of Object.entries(groups)) {
    const h = ls.reduce((s, l) => s + (+l.hours || 0), 0);
    out += `\n[${pid ? projLabel(proj(pid)) : 'General'}] ${h ? fmtH(h) : ''}\n`;
    for (const l of ls) {
      const t = task(l.taskId);
      const tag = l.type === 'work' ? '' : `[${LOGTYPE[l.type]}] `;
      out += `- ${tag}${t ? t.title + ': ' : ''}${l.text.replace(/\n+/g, ' ')}${l.hours ? ` (${fmtH(+l.hours)})` : ''}\n`;
    }
  }
  return out.trim();
}
function exportCsv() {
  const days = [...Array(7)].map((_, i) => addDays(ui.tsWeek, i));
  const logs = db.logs.filter(l => l.date >= days[0] && l.date <= days[6] && isActivity(l)).sort(by(l => l.date));
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const lines = [['Date', 'Weekday', 'Project Code', 'Project', 'Task', 'Type', 'Hours', 'Content'].join(',')];
  for (const l of logs) {
    const p = proj(l.projectId), t = task(l.taskId);
    lines.push([l.date, WD[parse(l.date).getDay()], p?.code, p?.name, t?.title, LOGTYPE[l.type], l.hours || '', l.text].map(q).join(','));
  }
  download(`timesheet-${days[0]}.csv`, '﻿' + lines.join('\r\n'), 'text/csv');
}
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function refreshTimeline() {
  const el = $('#timeline'), t = task(ui.taskId);
  if (!el || !t) return;
  const all = db.logs.filter(l => l.taskId === t.id);
  const f = ui.tlFilter;
  const shown = all.filter(l => f === 'all' || l.type === f);
  const acts = all.filter(isActivity);
  const hours = all.reduce((s, l) => s + (+l.hours || 0), 0);
  const openC = all.filter(l => l.type === 'commit' && !l.commitDone).length;
  const created = ymd(new Date(t.createdAt || Date.now()));
  const age = dayDiff(isDone(t) && t.doneAt ? ymd(new Date(t.doneAt)) : today(), created);
  const counts = type => all.filter(l => l.type === type).length;
  const filters = [['all', 'All'], ...Object.entries(LOGTYPE).filter(([k]) => counts(k)), ...(counts('status') ? [['status', 'Status changes']] : [])];
  const items = shown.slice();
  if (f === 'all') items.push({type: 'created', date: created, createdAt: (t.createdAt || 0) - 1});
  items.sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));
  const groups = [];
  for (const it of items) { const g = groups[groups.length - 1]; if (g && g.date === it.date) g.items.push(it); else groups.push({date: it.date, items: [it]}); }
  const td = today();
  el.innerHTML = `
    <div class="tlstats"><span><b>${fmtH(hours)}</b> logged</span><span><b>${acts.length}</b> ${acts.length === 1 ? 'update' : 'updates'}</span>
      <span><b>${openC}</b> open ${openC === 1 ? 'commitment' : 'commitments'}</span><span>${isDone(t) ? 'Finished after' : 'Open for'} <b>${plural(age, 'day')}</b></span></div>
    ${filters.length > 2 ? `<div class="tlf">${filters.map(([k, v]) => `<button data-act="tl-filter" data-f="${k}" class="${f === k ? 'on' : ''}">${v}</button>`).join('')}</div>` : ''}
    <div class="tl">${groups.map(g => {
      const gh = g.items.reduce((s, l) => s + (+l.hours || 0), 0);
      return `<div class="tl-day">${relDay(g.date)}${g.date === td || dayDiff(td, g.date) === 1 ? ` <span class="muted">${fmtDate(g.date)}</span>` : ''}${gh ? ` <span class="muted">· ${fmtH(gh)}</span>` : ''}</div>` +
        g.items.map(l => {
          if (l.type === 'created') return `<div class="tl-sys c-gray">Task created</div>`;
          if (l.type === 'status') {
            const name = (id, saved) => statuses().find(s => s.id === id)?.name || saved || id;
            const color = statuses().find(s => s.id === l.to)?.color || 'gray';
            return `<div class="tl-sys c-${color}">Status: ${esc(name(l.from, l.fromName))} → <b>${esc(name(l.to, l.toName))}</b> <button class="btn link small del" data-act="del-log" data-id="${l.id}">Delete</button></div>`;
          }
          const late = l.type === 'commit' && !l.commitDone && l.commitDue && l.commitDue < td;
          return `<div class="tl-item c-${LOGCOLOR[l.type]}">
            <div class="th"><b>${LOGTYPE[l.type]}</b>${l.hours ? `<span class="chip">${fmtH(+l.hours)}</span>` : ''}<span class="sp"></span>
              <button class="btn link small del" data-act="del-log" data-id="${l.id}">Delete</button></div>
            <div class="tx">${esc(l.text)}</div>
            ${l.type === 'commit' ? `<div class="cm">
              <label><input type="checkbox" data-act="toggle-commit" data-id="${l.id}" ${l.commitDone ? 'checked' : ''}> Kept</label>
              ${l.who ? `<span class="muted">By ${esc(l.who)}</span>` : ''}
              ${l.commitDue ? `<span class="${late ? 'chip danger' : 'muted'}">${late ? 'Overdue · ' : 'Due '}${fmtDate(l.commitDue)}</span>` : ''}</div>` : ''}
          </div>`;
        }).join('');
    }).join('') || '<div class="empty">No updates yet.</div>'}</div>`;
}
function autosaveTask(el) {
  const f = el.form, t = task(f.dataset.id); if (!t) return;
  const k = el.name, v = el.value;
  if (k === 'title') { if (!v.trim()) { el.value = t.title; return; } t.title = v.trim(); }
  else if (k === 'status') setStatus(t, v);
  else if (k === 'projectId') {
    t.projectId = v; t.milestoneId = '';
    for (const l of db.logs) if (l.taskId === t.id) l.projectId = v;
    const p = proj(v), chip = $('#d-proj');
    if (chip) chip.textContent = p ? (p.code || p.name) : '';
  }
  else if (['priority', 'milestoneId', 'owner', 'due', 'desc'].includes(k)) t[k] = typeof v === 'string' && k !== 'desc' ? v.trim() : v;
  else return;
  t.updatedAt = Date.now();
  save(); render();
}

  </div><div class="actions">${id ? `<button type="button" class="btn danger l" data-act="del-milestone" data-id="${m.id}">Delete</button>` : ''}
    <button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary">Save</button></div></form>`);
}
let statusDraft = null;
function statusModal() {
  const counts = id => db.tasks.filter(t => t.status === id).length;
  const kept = new Set(statusDraft.map(s => s.id));
  const lost = statuses().filter(s => !kept.has(s.id) && counts(s.id));
  const fallback = statusDraft.find(s => !s.done);
  openModal(`<h2>Customize board columns<button class="btn link x" data-act="close">Close ✕</button></h2>
  <p class="small muted">Rename, reorder, add or remove columns. Tick "Done" for columns that mean the task is finished. You need at least one Done column and one open column.</p>
  <div>${statusDraft.map((s, i) => `<div class="srow">
    <select data-sfield="color" data-i="${i}" class="c-${s.color}">${COLORS.map(c => `<option value="${c}" ${c === s.color ? 'selected' : ''}>● ${c}</option>`).join('')}</select>
    <input data-sfield="name" data-i="${i}" value="${esc(s.name)}" placeholder="Column name">
    <label class="small"><input type="checkbox" data-sfield="done" data-i="${i}" ${s.done ? 'checked' : ''}> Done</label>
    <span class="small muted">${plural(counts(s.id), 'task')}</span>
    <span class="ctl"><button class="btn sm" data-act="s-move" data-i="${i}" data-d="-1" ${i ? '' : 'disabled'}>↑</button><button class="btn sm" data-act="s-move" data-i="${i}" data-d="1" ${i < statusDraft.length - 1 ? '' : 'disabled'}>↓</button>
      <button class="btn sm danger" data-act="s-del" data-i="${i}">Remove</button></span>
  </div>`).join('')}</div>
  <div style="margin-top:10px"><button class="btn sm" data-act="s-add">+ Add column</button></div>
  ${lost.length && fallback ? `<p class="small" style="color:var(--warn)">Tasks in removed columns (${lost.map(s => esc(s.name)).join(', ')}) will move to "${esc(fallback.name)}".</p>` : ''}
  <div class="actions"><button type="button" class="btn l" data-act="s-reset">Reset to default</button><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="s-save">Save</button></div>`);
}

/* ---------- form handlers ---------- */
const forms = {
  task(f, d) {
    if (f.dataset.id) { document.activeElement?.blur(); return; }
    const title = d.get('title').trim(); if (!title) return;
    const now = Date.now(), status = d.get('status');
    const t = {id: uid(), title, projectId: d.get('projectId'), milestoneId: d.get('milestoneId'), owner: d.get('owner').trim(),
      due: d.get('due'), status, priority: d.get('priority'), desc: d.get('desc').trim(), createdAt: now, updatedAt: now, doneAt: st(status).done ? now : 0};
    db.tasks.push(t);
    save(); openTask(t.id); toast('Task created');
  },
  'quick-task'(f, d) {
    const title = d.get('title').trim(); if (!title) return;
    const now = Date.now();
    db.tasks.push({id: uid(), title, projectId: d.get('projectId'), milestoneId: '', owner: d.get('owner').trim(), due: d.get('due'),
      status: firstOpen().id, priority: 'medium', desc: '', createdAt: now, updatedAt: now, doneAt: 0});
    save(); render(); toast('Task added');
    setTimeout(() => { const i = $('[data-form="quick-task"] [name=title]'); if (i) i.focus(); });
  },
  log(f, d) {
    const t = task(f.dataset.task), text = d.get('text').trim(); if (!t || !text) return;
    const type = d.get('type');
    db.logs.push({id: uid(), taskId: t.id, projectId: t.projectId, date: d.get('date') || today(), type, text,
      hours: +d.get('hours') || 0, who: type === 'commit' ? d.get('who').trim() : '', commitDue: type === 'commit' ? d.get('commitDue') : '',
      commitDone: false, createdAt: Date.now()});
    t.updatedAt = Date.now();
    save();
    f.text.value = ''; f.hours.value = '';
    refreshTimeline(); render(); toast('Update added');
  },
  'quick-log'(f, d) {
    const text = d.get('text').trim(); if (!text) return;
    db.logs.push({id: uid(), taskId: d.get('taskId'), projectId: d.get('projectId'), date: d.get('date'), type: d.get('type'), text,
      hours: +d.get('hours') || 0, who: '', commitDue: '', commitDone: false, createdAt: Date.now()});
    ui.tsDay = d.get('date');
    save(); closeModal(); render(); refreshTimeline(); toast('Time logged');
  },
  project(f, d) {
    const id = f.dataset.id;
    const data = {name: d.get('name').trim(), code: d.get('code').trim(), client: d.get('client').trim(), start: d.get('start'), end: d.get('end'), status: d.get('status'), desc: d.get('desc').trim()};
    if (!data.name) return;
    if (id) Object.assign(proj(id), data);
    else { const p = {id: uid(), createdAt: Date.now(), ...data}; db.projects.push(p); ui.projectId = p.id; view = 'project'; }
    save(); closeModal(); render(); toast('Project saved');
  },
  milestone(f, d) {
    const id = f.dataset.id;
    const data = {name: d.get('name').trim(), planDate: d.get('planDate'), actualDate: d.get('actualDate'), status: d.get('status'), note: d.get('note').trim()};
    if (data.status === 'done' && !data.actualDate) data.actualDate = today();
    if (id) Object.assign(ms(id), data);
    else db.milestones.push({id: uid(), projectId: f.dataset.project, ...data});
    save(); closeModal(); render();
  },
  settings(f, d) {
    db.settings.me = d.get('me').trim();
    db.settings.hoursPerDay = +d.get('hoursPerDay') || 8;
    save(); render(); toast('Settings saved');
  },
};

/* ---------- click actions ---------- */
const actions = {
  nav: a => { view = a.dataset.view; closeModal(); render(); window.scrollTo(0, 0); },
  close: () => closeModal(),
  'close-drawer': () => closeDrawer(),
  'new-task': a => newTask({projectId: a.dataset.project}),
  'open-task': a => a.dataset.id && openTask(a.dataset.id),
  'toggle-done': a => {
    const t = task(a.dataset.id);
    setStatus(t, isDone(t) ? firstOpen().id : firstDone().id);
    save(); render();
    if (isDone(t)) toast('Done: ' + t.title);
  },
  'toggle-commit': a => {
    const l = db.logs.find(x => x.id === a.dataset.id); l.commitDone = !l.commitDone; save();
    refreshTimeline(); render();
  },
  'del-log': a => {
    const l = db.logs.find(x => x.id === a.dataset.id);
    if (!confirm('Delete this record?')) return;
    db.logs = db.logs.filter(x => x !== l); save(); refreshTimeline(); render();
  },
  'tl-filter': a => { ui.tlFilter = a.dataset.f; refreshTimeline(); },
  'del-task': a => {
    const t = task(a.dataset.id), n = db.logs.filter(l => l.taskId === t.id && isActivity(l)).length;
    if (!confirm(`Delete task "${t.title}"?${n ? `\nIts ${plural(n, 'record')} (including hours) will also be deleted.` : ''}\nIf the task is finished, set its status to Done instead.`)) return;
    db.tasks = db.tasks.filter(x => x !== t); db.logs = db.logs.filter(l => l.taskId !== t.id);
    save(); closeDrawer(); render();
  },
  'new-project': () => projectModal(),
  'edit-project': a => projectModal(a.dataset.id),
  'open-project': a => { ui.projectId = a.dataset.id; view = 'project'; render(); window.scrollTo(0, 0); },
  'del-project': a => {
    const p = proj(a.dataset.id), nt = db.tasks.filter(t => t.projectId === p.id).length, nl = db.logs.filter(l => l.projectId === p.id && isActivity(l)).length;
    if (!confirm(`Delete project "${p.name}"?\nThis also deletes ${plural(nt, 'task')} and ${plural(nl, 'record')} (including hours).\nIf the project has ended, set its status to Closed instead.`)) return;
    db.projects = db.projects.filter(x => x !== p);
    db.tasks = db.tasks.filter(t => t.projectId !== p.id);
    db.logs = db.logs.filter(l => l.projectId !== p.id);
    db.milestones = db.milestones.filter(m => m.projectId !== p.id);
    if (ui.taskId && !task(ui.taskId)) closeDrawer();
    save(); closeModal(); view = 'projects'; render();
  },
  'toggle-closed': () => { ui.showClosed = !ui.showClosed; render(); },
  'new-milestone': a => milestoneModal(null, a.dataset.project),
  'edit-milestone': a => milestoneModal(a.dataset.id),
  'del-milestone': a => {
    if (!confirm('Delete this milestone? Its tasks will be kept.')) return;
    db.milestones = db.milestones.filter(m => m.id !== a.dataset.id);
    for (const t of db.tasks) if (t.milestoneId === a.dataset.id) t.milestoneId = '';
    save(); closeModal(); render();
  },
  'board-mode': a => { ui.board.mode = a.dataset.mode; render(); },
  'board-filter': a => { Object.assign(ui.board, {project: '', owner: '', q: '', due: a.dataset.due}); view = 'board'; render(); },
  'edit-statuses': () => { statusDraft = structuredClone(statuses()); statusModal(); },
  's-move': a => { const i = +a.dataset.i, j = i + +a.dataset.d; [statusDraft[i], statusDraft[j]] = [statusDraft[j], statusDraft[i]]; statusModal(); },
  's-del': a => { statusDraft.splice(+a.dataset.i, 1); statusModal(); },
  's-add': () => { statusDraft.splice(Math.max(statusDraft.findIndex(s => s.done), 0) || statusDraft.length, 0, {id: uid(), name: 'New column', color: 'teal', done: false}); statusModal();
    setTimeout(() => { const ins = document.querySelectorAll('#modal [data-sfield=name]'); const n = [...ins].find(i => i.value === 'New column'); if (n) { n.focus(); n.select(); } }); },
  's-reset': () => {
    const known = new Set(DEFAULT_STATUSES.map(s => s.id));
    statusDraft = [...structuredClone(DEFAULT_STATUSES), ...statusDraft.filter(s => !known.has(s.id) && db.tasks.some(t => t.status === s.id))];
    statusModal();
  },
  's-save': () => {
    const draft = statusDraft.map(s => ({...s, name: s.name.trim()}));
    if (draft.some(s => !s.name)) return alert('Every column needs a name.');
    if (!draft.some(s => s.done)) return alert('Mark at least one column as Done.');
    if (!draft.some(s => !s.done)) return alert('You need at least one column that is not Done.');
    const ids = new Set(draft.map(s => s.id)), fb = draft.find(s => !s.done), fbDone = draft.find(s => s.done);
    for (const t of db.tasks) if (!ids.has(t.status)) t.status = isDone(t) ? fbDone.id : fb.id;
    db.settings.statuses = draft;
    for (const t of db.tasks) { if (st(t.status).done && !t.doneAt) t.doneAt = Date.now(); if (!st(t.status).done) t.doneAt = 0; }
    save(); closeModal(); render(); if (ui.taskId) renderDrawer(); toast('Columns saved');
  },
  'quick-log': a => quickLogModal(a.dataset.d),
  'ts-week': a => { const n = +a.dataset.n; ui.tsWeek = n ? addDays(ui.tsWeek, n) : weekStart(today()); ui.tsDay = n ? addDays(ui.tsDay, n) : today(); render(); },
  'ts-day': a => { ui.tsDay = a.dataset.d; render(); },
  'copy-summary': async () => {
    const txt = $('#summary').value;
    try { await navigator.clipboard.writeText(txt); } catch (e) { $('#summary').select(); document.execCommand('copy'); }
    toast('Copied to clipboard');
  },
  'export-csv': () => exportCsv(),
  'export-json': () => {
    db.settings.lastExport = Date.now(); save();
    download(`pm-assistant-backup-${today()}.json`, JSON.stringify(db, null, 1), 'application/json'); render();
  },
  'import-json': () => $('#import-input').click(),
  'link-new-file': () => linkNewFile(),
  'link-existing-file': () => linkExistingFile(),
  'reconnect-file': () => reconnectFile(),
  'unlink-file': () => unlinkFile(),
  'load-sample': () => { loadSample(); save(); view = 'today'; render(); toast('Sample data loaded. You can remove it in Settings.'); },
  'remove-sample': () => {
    if (!confirm('Remove all sample projects, tasks and records? Your own data is kept.')) return;
    const ids = new Set(db.projects.filter(p => p.sample).map(p => p.id));
    db.projects = db.projects.filter(p => !p.sample);
    db.milestones = db.milestones.filter(m => !ids.has(m.projectId));
    db.tasks = db.tasks.filter(t => !t.sample && !ids.has(t.projectId));
    db.logs = db.logs.filter(l => !l.sample && !ids.has(l.projectId));
    if (ui.taskId && !task(ui.taskId)) closeDrawer();
    save(); render();
  },
  'clear-all': () => {
    if (!confirm('Delete all data? This cannot be undone. Export a backup first.')) return;
    if (prompt('Type DELETE to confirm') !== 'DELETE') return;
    const s = db.settings; db = emptyDb(); db.settings = s; closeDrawer(); save(); view = 'today'; render();
  },
};

/* ---------- events ---------- */
document.addEventListener('click', e => {
  if (e.target.id === 'modal') return closeModal();
  const a = e.target.closest('[data-act]');
  if (!a || !actions[a.dataset.act]) return;
  if (a.tagName === 'A') e.preventDefault();
  actions[a.dataset.act](a, e);
});
document.addEventListener('submit', e => {
  const f = e.target; if (!forms[f.dataset.form]) return;
  e.preventDefault(); forms[f.dataset.form](f, new FormData(f));
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.filter) {
    ui.board[el.dataset.filter] = el.type === 'checkbox' ? el.checked : el.value;
    $('#board-body').innerHTML = boardBody();
  }
  if (el.dataset.sfield === 'name') statusDraft[+el.dataset.i].name = el.value;
});
document.addEventListener('change', e => {
  const el = e.target, form = el.form;
  if (el.dataset.filter !== undefined && el.tagName === 'SELECT') { ui.board[el.dataset.filter] = el.value; $('#board-body').innerHTML = boardBody(); }
  if (el.dataset.sfield === 'color') { statusDraft[+el.dataset.i].color = el.value; statusModal(); }
  if (el.dataset.sfield === 'done') statusDraft[+el.dataset.i].done = el.checked;
  if (el.hasAttribute('data-task-target')) form.taskId.innerHTML = taskOptions(el.value, '');
  if (form && form.dataset.form === 'task') {
    if (el.name === 'projectId') form.milestoneId.innerHTML = msOptions(el.value, '');
    if (form.dataset.id) autosaveTask(el);
  }
  if (form && form.dataset.form === 'log' && el.name === 'type') form.querySelector('.cf').hidden = el.value !== 'commit';
});
$('#import-input').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  try {
    const data = migrate(JSON.parse(await file.text()));
    if (!confirm(`Replace current data with this backup?\nThe backup has ${plural(data.projects.length, 'project')}, ${plural(data.tasks.length, 'task')} and ${plural(data.logs.length, 'record')}.`)) return;
    db = data; closeDrawer(); save(); render(); toast('Backup restored');
  } catch (err) { alert('This file is not a valid backup: ' + err.message); }
});
document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('[data-drag]'); if (c) e.dataTransfer.setData('text/plain', c.dataset.drag); });
document.addEventListener('dragover', e => { const c = e.target.closest && e.target.closest('[data-drop]'); if (c) { e.preventDefault(); c.classList.add('over'); } });
document.addEventListener('dragleave', e => { const c = e.target.closest && e.target.closest('[data-drop]'); if (c && !c.contains(e.relatedTarget)) c.classList.remove('over'); });
document.addEventListener('drop', e => {
  const c = e.target.closest && e.target.closest('[data-drop]'); if (!c) return;
  e.preventDefault();
  const t = task(e.dataTransfer.getData('text/plain')); if (!t) return;
  setStatus(t, c.dataset.drop); save();
  $('#board-body').innerHTML = boardBody();
});
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase(), typing = ['input', 'textarea', 'select'].includes(tag);
  if (e.key === 'Escape') {
    if (!$('#modal').hidden) return closeModal();
    if (typing && e.target.closest('#drawer')) return e.target.blur();
    if (!$('#drawer').hidden) return closeDrawer();
  }
  if (typing || e.ctrlKey || e.metaKey || e.altKey || !$('#modal').hidden) return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); newTask(); }
  if (e.key === 'l' || e.key === 'L') { e.preventDefault(); quickLogModal(view === 'timesheet' ? ui.tsDay : today()); }
});
// refresh when the date changes
let lastDay = today();
setInterval(() => { if (today() !== lastDay) { lastDay = today(); render(); refreshTimeline(); } }, 60000);
// keep several open tabs in sync
window.addEventListener('storage', e => { if (e.key === KEY && e.newValue) { db = migrate(JSON.parse(e.newValue)); render(); if (ui.taskId) renderDrawer(); } });

/* ---------- render ---------- */
function render() {
  document.querySelectorAll('.nav').forEach(n => n.classList.toggle('on', n.dataset.view === (view === 'project' ? 'projects' : view)));
  $('#main').innerHTML = views[view]();
  const td = today(), n = db.tasks.filter(t => isOpen(t) && t.due && t.due <= td).length;
  const b = $('#n-today'); b.hidden = !n; b.textContent = n;
  renderBadge();
}

/* ---------- sample data ---------- */
function loadSample() {
  const td = today(), me = db.settings.me || 'Me', now = Date.now();
  let seq = 0;
  const P = (name, code, client, s, e, desc) => { const p = {id: uid(), name, code, client, status: 'active', start: addDays(td, s), end: addDays(td, e), desc, sample: true, createdAt: now}; db.projects.push(p); return p; };
  const M = (p, name, plan, status, actual) => { const m = {id: uid(), projectId: p.id, name, planDate: addDays(td, plan), actualDate: actual != null ? addDays(td, actual) : '', status, note: ''}; db.milestones.push(m); return m; };
  const T = (p, m, title, owner, due, status, priority, age) => { const t = {id: uid(), projectId: p.id, milestoneId: m ? m.id : '', title, owner, due: due == null ? '' : addDays(td, due), status, priority, desc: '', sample: true, createdAt: now - age * 864e5, updatedAt: now, doneAt: status === 'done' ? now - 20 * 864e5 : 0}; db.tasks.push(t); return t; };
  const L = (t, p, day, type, text, hours, extra = {}) => db.logs.push({id: uid(), taskId: t ? t.id : '', projectId: p.id, date: addDays(td, day), type, text, hours, who: '', commitDue: '', commitDone: false, sample: true, createdAt: now + day * 864e5 + seq++, ...extra});

  const m5 = M(p2, 'New site confirmed', -3, 'doing'); M(p2, 'Fit-out complete', 30, 'planned');
  const t1 = T(p1, m1, 'Send requirements document for business sign-off', me, -20, 'done', 'high', 30);

  const t3 = T(p1, m2, 'Confirm data migration approach', 'Ben', -2, 'waiting', 'high', 7);
  T(p1, m3, 'Prepare UAT test cases', 'Chen Wei', 12, 'todo', 'medium', 3);
  const t5 = T(p1, null, 'Update weekly status report', me, 0, 'todo', 'medium', 2);
  const t6 = T(p2, m5, 'Confirm lease terms with landlord', me, 1, 'doing', 'high', 10);
  const t7 = T(p2, null, 'Collect seating needs from each team', 'Priya', 5, 'todo', 'low', 4);
  T(p2, null, 'Compare IT cabling quotes', 'Ben', 9, 'todo', 'medium', 1);
  S(t1, p1, -24, 'todo', 'doing'); L(t1, p1, -24, 'work', 'Drafted requirements document.', 3);
  S(t1, p1, -21, 'doing', 'done'); L(t1, p1, -21, 'decision', 'Business agreed: reports module moves to phase 2.', 0);
  S(t2, p1, -8, 'todo', 'doing');
  L(t2, p1, -8, 'work', 'Kick-off with Alice. Agreed on build plan for the quotation module.', 1);
  L(t2, p1, -4, 'work', 'Checked progress: about 40% done.', 0.5);
  L(t2, p1, -4, 'risk', 'Pricing rules are more complex than planned. May need 3 more days.', 0);
  L(t2, p1, -1, 'work', 'Meeting with Alice on quotation module. About 60% done.', 1);
  L(t2, p1, 0, 'work', 'Reviewed test results for the quotation module. Found 3 issues.', 1.5);
  L(t2, p1, 0, 'commit', 'Send the issue list to Alice', 0, {who: me, commitDue: addDays(td, 2)});
  S(t3, p1, -5, 'todo', 'doing'); S(t3, p1, -3, 'doing', 'waiting');
  L(t3, p1, -3, 'work', 'Discussed options with Ben and the vendor.', 1);
  L(t3, p1, -1, 'commit', 'Provide first draft of the migration approach', 0, {who: 'Ben', commitDue: addDays(td, 1)});
  L(t3, p1, -1, 'risk', 'Old system data quality is poor. Migration may be delayed.', 0.5);
  S(t6, p2, -6, 'todo', 'doing');

  L(t6, p2, 0, 'work', 'Call with landlord about lease questions.', 1);
  L(null, p1, -1, 'work', 'Weekly project meeting', 1.5);
  L(t7, p2, -1, 'work', 'Emailed all teams to collect seating needs.', 0.5);
  L(t5, p1, 0, 'work', 'Collected this week\'s progress. Started the report.', 1);

render();
initFile();
</script>
